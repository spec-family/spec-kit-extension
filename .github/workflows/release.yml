name: release

# A release is a v* tag on a commit main has, and nothing else. The tag,
# extension.yml's version and a dated section of CHANGELOG.md must agree, and
# the GitHub release carries that section as its notes. Spec Kit installs the
# tag's own archive, archive/refs/tags/v<version>.zip, so the release
# attaches nothing to it.

on:
  push:
    tags: ['v*']

# A release is not a thing to cancel halfway through.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # All of history, so the tagged commit can be checked against main.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      # A tag can point at any commit, one on a branch nobody reviewed among
      # them. Only what main has is released.
      - name: The tagged commit must be on main
        run: |
          status=0
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || status=$?
          if [ "$status" -eq 0 ]; then
            echo "$GITHUB_SHA is on main."
          elif [ "$status" -eq 1 ]; then
            echo "::error::$GITHUB_SHA is not on main; release from a commit main has"
            exit 1
          else
            echo "::error::could not tell whether $GITHUB_SHA is on main: git merge-base exited $status"
            exit 1
          fi

      - name: The tag, extension.yml and CHANGELOG.md must agree
        run: |
          node scripts/check-release.mjs "$GITHUB_REF_NAME" > release-notes.md
          {
            echo "### ${GITHUB_REF_NAME}"
            echo
            cat release-notes.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: The manifest, against Spec Kit's rules and the community catalogue's
        run: node scripts/check-manifest.mjs

      - name: The manifest, the templates, the commands and the fixture agree
        run: npm test

  github-release:
    name: GitHub release
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # gh release create
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            /CHANGELOG.md
            /extension.yml
            /scripts/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/check-release.mjs "$GITHUB_REF_NAME" > release-notes.md
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "spec-family checks ${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md \
            --verify-tag
