name: release

# A release is a v* tag on a commit main has, and nothing else. The tag,
# extension.yml's version and a dated section of CHANGELOG.md must agree;
# Spec Kit's own CLI must install the extension from the tag's archive, the
# download URL a user and the community catalogue are given; and only then is
# the GitHub release made, with that section as its notes. Spec Kit installs
# the tag's archive, so the release attaches nothing to it.

on:
  push:
    tags: ['v*']

  # A rehearsal: the same checks, and the install from GitHub's archive of
  # the dispatched commit, archive/<sha>.zip, without a release.
  workflow_dispatch:

# A release is not a thing to cancel halfway through.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # All of history, so the tagged commit can be checked against main.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      # A tag can point at any commit, one on a branch nobody reviewed among
      # them. Only what main has is released; a rehearsal from a branch makes
      # no release, so it goes on, having said so.
      - name: The tagged commit must be on main
        run: |
          status=0
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || status=$?
          if [ "$status" -eq 0 ]; then
            echo "$GITHUB_SHA is on main."
          elif [ "$status" -ne 1 ]; then
            echo "::error::could not tell whether $GITHUB_SHA is on main: git merge-base exited $status"
            exit 1
          elif [ "$GITHUB_REF_TYPE" = 'tag' ]; then
            echo "::error::$GITHUB_SHA is not on main; release from a commit main has"
            exit 1
          else
            echo "$GITHUB_SHA is not on main: a rehearsal from $GITHUB_REF_NAME, which releases nothing."
          fi

      # A rehearsal checks the version extension.yml gives, as its tag would.
      - name: The tag, extension.yml and CHANGELOG.md must agree
        run: |
          tag="$GITHUB_REF_NAME"
          if [ "$GITHUB_REF_TYPE" != 'tag' ]; then
            tag="v$(node --input-type=module -e "import { readFileSync } from 'node:fs'; import { parseYamlSubset } from './scripts/yaml-subset.mjs'; console.log(parseYamlSubset(readFileSync('extension.yml', 'utf8')).extension.version)")"
          fi
          node scripts/check-release.mjs "$tag" > release-notes.md
          {
            echo "### ${tag}"
            echo
            cat release-notes.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: The manifest, against Spec Kit's rules and the community catalogue's
        run: node scripts/check-manifest.mjs

      - name: The manifest, the templates, the commands and the fixture agree
        run: npm test

  # The download URL the submission gives, installed by Spec Kit's CLI as a
  # user installs it, and held to what install.yml holds every change to.
  install:
    name: install from the tag's archive
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: ./.github/actions/scratch-project
        with:
          integration: copilot

      - name: Install the extension from GitHub's archive, by its URL
        working-directory: ${{ runner.temp }}/scratch
        run: |
          if [ "$GITHUB_REF_TYPE" = 'tag' ]; then
            url="https://github.com/$GITHUB_REPOSITORY/archive/refs/tags/$GITHUB_REF_NAME.zip"
          else
            url="https://github.com/$GITHUB_REPOSITORY/archive/$GITHUB_SHA.zip"
          fi
          echo "Installing from $url" >> "$GITHUB_STEP_SUMMARY"
          # specify asks before installing from a URL no catalogue vouches for.
          printf 'y\n' | specify extension add --from "$url"

      - name: The installed copy, the commands, the templates and the hooks are where Spec Kit puts them
        run: node scripts/check-install.mjs "$RUNNER_TEMP/scratch" copilot

      - name: The setup the commands ask for, and every check they run, in that project
        if: ${{ !cancelled() }}
        run: node scripts/run-commands.mjs "$RUNNER_TEMP/scratch"

      - name: What specify wrote, to read a failure by
        if: failure()
        working-directory: ${{ runner.temp }}/scratch
        run: |
          find . -path ./node_modules -prune -o -type f -print | sort
          cat .specify/extensions.yml || true
          specify extension list || true

  github-release:
    name: GitHub release
    needs: [verify, install]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # gh release create
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            /CHANGELOG.md
            /extension.yml
            /scripts/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/check-release.mjs "$GITHUB_REF_NAME" > release-notes.md
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "spec-family checks ${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md \
            --verify-tag
